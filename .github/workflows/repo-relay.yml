name: Discord Notify

on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send push notification to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret not set"
            exit 1
          fi
          payload="{\"content\":\"New push to ${GITHUB_REPOSITORY} by ${GITHUB_ACTOR}: ${GITHUB_SHA}\"}"
          curl -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
