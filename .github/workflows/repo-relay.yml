      - name: Parse commits and build payload (robust)
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          REPO_URL: https://github.com/${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ACTOR_AVATAR: https://github.com/${{ github.actor }}.png
        shell: bash
        run: |
          set -euo pipefail

          EVENT="$GITHUB_EVENT_PATH"
          if [ ! -f "$EVENT" ]; then
            echo "::error::GITHUB_EVENT_PATH ($EVENT) not found"
            exit 11
          fi

          # Ensure jq is available
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq not installed"
            exit 20
          fi

          # Count commits safely
          commits_count=$(jq -r 'if .commits then (.commits | length) else 0 end' "$EVENT") || {
            echo "::error::Failed to read commits from event payload"
            exit 12
          }
          echo "Commits count: $commits_count"

          commits_md=""
          if [ "$commits_count" -gt 0 ]; then
            for i in $(seq 0 $((commits_count - 1))); do
              sha=$(jq -r --argjson idx "$i" '.commits[$idx].id // empty' --argjson idx "$i" "$EVENT")
              # fallback if id missing
              if [ -z "$sha" ]; then
                echo "::warning::commit[$i] has no id; skipping"
                continue
              fi
              short=${sha:0:7}
              msg=$(jq -r --argjson idx "$i" '.commits[$idx].message // "<no message>"' --argjson idx "$i" "$EVENT" | tr '\n' ' ')
              author_name=$(jq -r --argjson idx "$i" '.commits[$idx].author.name // .commits[$idx].author.username // "unknown"' --argjson idx "$i" "$EVENT")
              author_username=$(jq -r --argjson idx "$i" '.commits[$idx].author.username // empty' --argjson idx "$i" "$EVENT")
              if [ -n "$author_username" ] && [ "$author_username" != "null" ]; then
                author_avatar="https://github.com/${author_username}.png"
              else
                author_avatar="$ACTOR_AVATAR"
              fi
              commits_md="${commits_md}• [\`${short}\`](${REPO_URL}/commit/${sha}) — ${msg} — *${author_name}*\n"
              # limit to 6 commits
              if [ "$(echo -n "$commits_md" | grep -c '• ')" -ge 6 ]; then
                break
              fi
            done
          fi

          if [ -z "$commits_md" ]; then
            echo "No commits parsed; using fallback commit info"
            commits_md="• [\`${GITHUB_SHA:0:7}\`](${REPO_URL}/commit/${GITHUB_SHA})"
          fi

          branch=${GITHUB_REF#refs/heads/}
          title="Push to ${branch} in ${REPO}"
          description="**Pusher:** ${ACTOR}\n\n${commits_md}"

          payload=$(jq -n --arg t "$title" \
                          --arg d "$description" \
                          --arg url "$REPO_URL" \
                          --arg actor "$ACTOR" \
                          --arg actor_avatar "$ACTOR_AVATAR" '{
            embeds: [
              {
                title: $t,
                description: $d,
                url: $url,
                color: 3066993,
                author: { name: $actor, icon_url: $actor_avatar }
              }
            ]
          }')

          echo "Payload preview (first 1000 chars):"
          echo "$payload" | head -c 1000
          echo

          # Send and capture HTTP status
          http_status=$(curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" -d "$payload" "$WEBHOOK" || true)
          echo "Discord webhook HTTP status: $http_status"
          if [ "$http_status" -ge 200 ] && [ "$http_status" -lt 300 ]; then
            echo "Message posted successfully."
          else
            echo "::error::Discord webhook returned HTTP status $http_status"
            exit 13
          fi
