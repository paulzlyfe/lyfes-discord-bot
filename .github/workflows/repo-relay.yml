name: Discord Push Notify Debug

on:
  push:
    branches:
      - main
      - 'release/*'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Show runner info
        run: |
          echo "Runner: $(uname -a)"
          echo "Shell: $SHELL"
          echo "GitHub actor: $GITHUB_ACTOR"
          echo "Event path: $GITHUB_EVENT_PATH"
      
      - name: Validate webhook secret
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DISCORD_WEBHOOK secret not set or empty"
            exit 10
          fi
          echo "DISCORD_WEBHOOK is set (hidden)."

      - name: Show event payload (first 2000 chars)
        run: |
          echo "=== EVENT PAYLOAD START ==="
          head -c 2000 "$GITHUB_EVENT_PATH" || true
          echo "=== EVENT PAYLOAD END ==="

      - name: Install jq (ensures jq present)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Parse commits and build payload (verbose)
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          REPO_URL: https://github.com/${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ACTOR_AVATAR: https://github.com/${{ github.actor }}.png
        shell: bash
        run: |
          set -o pipefail
          EVENT="$GITHUB_EVENT_PATH"
          # Safety: ensure file exists
          if [ ! -f "$EVENT" ]; then
            echo "::error::GITHUB_EVENT_PATH ($EVENT) not found"
            exit 11
          fi

          # Try to extract commits array length
          commits_count=$(jq -r 'if .commits then (.commits | length) else 0 end' "$EVENT") || {
            echo "::error::jq failed to read commits"
            exit 12
          }
          echo "Commits count: $commits_count"

          # Build commit list safely (max 6)
          commits_md=""
          if [ "$commits_count" -gt 0 ]; then
            idx=0
            jq -c '.commits[]' "$EVENT" | while IFS= read -r commit; do
              sha=$(echo "$commit" | jq -r '.id // empty')
              short=${sha:0:7}
              msg=$(echo "$commit" | jq -r '.message // "<no message>"' | tr '\n' ' ')
              author_name=$(echo "$commit" | jq -r '.author.name // .author.username // "unknown"' )
              commits_md="${commits_md}• [\`${short}\`](${REPO_URL}/commit/${sha}) — ${msg} — *${author_name}*\n"
              idx=$((idx+1))
              [ $idx -ge 6 ] && break
            done
          fi

          if [ -z "$commits_md" ]; then
            echo "No commits parsed; using fallback commit info"
            commits_md="• [\`${GITHUB_SHA:0:7}\`](${REPO_URL}/commit/${GITHUB_SHA})"
          fi

          branch=${GITHUB_REF#refs/heads/}
          title="Push to ${branch} in ${REPO}"
          description="**Pusher:** ${ACTOR}\n\n${commits_md}"

          payload=$(jq -n --arg t "$title" --arg d "$description" --arg actor "$ACTOR" --arg actor_avatar "$ACTOR_AVATAR" --arg url "$REPO_URL" '{
            embeds: [
              {
                title: $t,
                description: $d,
                url: $url,
                color: 3066993,
                author: { name: $actor, icon_url: $actor_avatar }
              }
            ]
          }')

          echo "Payload preview (first 1000 chars):"
          echo "$payload" | head -c 1000
          echo

          # Send and capture HTTP status
          http_status=$(curl -s -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" -d "$payload" "$WEBHOOK" || true)
          echo "Discord webhook HTTP status: $http_status"
          if [ "$http_status" -ge 200 ] && [ "$http_status" -lt 300 ]; then
            echo "Message posted successfully."
          else
            echo "::error::Discord webhook returned HTTP status $http_status"
            exit 13
          fi
