name: Build & Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - "artifacts/discord-bot/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: # allow manual re-runs from the GitHub Actions UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/discord-bot/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lyfe-bot:latest

      # Watchtower running on your VM will detect the new image and restart the bot automatically.
      # No SSH required. See README for one-time VM setup instructions.
