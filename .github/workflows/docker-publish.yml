name: Build & Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - "artifacts/discord-bot/**"
      - ".github/workflows/docker-publish.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: artifacts/discord-bot/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lyfe-bot:latest

      - name: Deploy to Google Cloud VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCE_HOST }}
          username: ${{ secrets.GCE_USERNAME }}
          key: ${{ secrets.GCE_SSH_KEY }}
          script: |
            docker pull paulzlyfe/lyfe-bot:latest
            docker stop lyfe-bot || true
            docker rm lyfe-bot || true
            docker run -d \
              --name lyfe-bot \
              --restart always \
              -e DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }} \
              -e FLY_APP_NAME=lyfe-moderation-bot \
              -e DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }} \
              -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              paulzlyfe/lyfe-bot:latest
            docker run --rm \
              -e DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }} \
              -e DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }} \
              paulzlyfe/lyfe-bot:latest \
              node --import tsx/esm src/deploy-commands.ts
