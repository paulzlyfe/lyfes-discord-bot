name: Discord Notify (Production)

on:
  push:
    branches: [ main, 'release/*' ]
  pull_request:
    types: [opened, reopened, closed, synchronized]
  release:
    types: [published]
  issues:
    types: [opened, edited, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Run Discord notify action
        uses: ./.github/actions/discord-notify
        with:
          # optional: override or leave empty to use secrets
          # webhook: ${{ secrets.DISCORD_WEBHOOK }}
          # bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}
          # channel-id: ${{ secrets.DISCORD_CHANNEL_ID }}
          max-embed-chars: '6000'
