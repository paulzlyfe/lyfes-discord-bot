name: Discord Notify (Production)

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    types: [opened, reopened, closed, synchronized]
  release:
    types: [published]
  issues:
    types: [opened, edited, closed]

jobs:
  notify:
    # Guard: avoid duplicate/empty push triggers (skip when push before==after)
    if: ${{ github.event_name != 'push' || github.event.before != github.event.after }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Validate webhook secret
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DISCORD_WEBHOOK secret not set or empty"
            exit 10
          fi
          echo "DISCORD_WEBHOOK is set (hidden)."

      - name: Optional thread config check
        env:
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          if [ -n "${BOT_TOKEN:-}" ] && [ -z "${CHANNEL_ID:-}" ]; then
            echo "::warning::DISCORD_BOT_TOKEN is set but DISCORD_CHANNEL_ID is missing; threaded updates will be skipped."
          fi
          echo "Threading config checked."

      - name: Checkout repository (for diffs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq git

      - name: Restore last-posted SHA (cache)
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: last_posted_sha.txt
          key: discord-last-sha-${{ github.repository }}
          restore-keys: |
            discord-last-sha-${{ github.repository }}-

      - name: Read last posted SHA
        id: read-last
        run: |
          LAST=""
          if [ -f last_posted_sha.txt ]; then
            LAST=$(cat last_posted_sha.txt)
          fi
          echo "last=$LAST" >> $GITHUB_OUTPUT

      - name: Skip if already posted
        if: ${{ steps.read-last.outputs.last == github.sha }}
        run: |
          echo "Already posted SHA $GITHUB_SHA; skipping."
          exit 0

      - name: Build and send Discord payload (production)
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          REPO: ${{ github.repository }}
          REPO_URL: https://github.com/${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          ACTOR_AVATAR: https://github.com/${{ github.actor }}.png
          OWNER_AVATAR: https://github.com/${{ github.repository_owner }}.png
          MAX_EMBED_CHARS: 6000
          MAX_COMMIT_LINES: 6
          MAX_COMMIT_MSG_LEN: 200
          MAX_FILE_LIST: 20
          MAX_DIFF_BYTES:
