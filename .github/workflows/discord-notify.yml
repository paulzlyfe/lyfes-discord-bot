name: Discord Notify
on:
  push:
    branches:
      - discord-notify/centralize-action

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Run Discord Notify Action
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          use-bot: 'false'
