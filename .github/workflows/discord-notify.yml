name: Discord Notify
on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, reopened, closed, synchronize]
  release:
    types: [published]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Run Discord Notify Action
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
