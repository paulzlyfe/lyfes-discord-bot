services:
  lyfe-bot:
    image: paulzlyfe/lyfe-bot:latest
    container_name: lyfe-bot
    restart: always
    env_file: .env          # keeps secrets out of the compose file
    environment:
      - FLY_APP_NAME=lyfe-moderation-bot   # satisfies the startup guard
    volumes:
      # Mount your Netscape-format YouTube cookies so yt-dlp can authenticate.
      # See README: export with the "Get cookies.txt LOCALLY" Chrome extension,
      # save as ~/bot/cookies.txt, then run: docker compose up -d
      - ./cookies.txt:/cookies.txt:ro

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 lyfe-bot     # check Docker Hub every 60 s, only watch lyfe-bot
