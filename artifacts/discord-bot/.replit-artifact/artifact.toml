kind = "api"
previewPath = "/discord-bot"
title = "Discord Bot"

[[services]]
localPort = 3000
name = "Discord Bot"
paths = ["/discord-bot"]

[services.development]
run = "pnpm --filter @workspace/discord-bot run start"

[services.production]

[services.production.build]
args = ["pnpm", "install", "--frozen-lockfile"]

[services.production.run]
args = ["node", "--experimental-sqlite", "--import", "tsx/esm", "artifacts/discord-bot/src/index.ts"]

[services.production.health.startup]
path = "/discord-bot"
