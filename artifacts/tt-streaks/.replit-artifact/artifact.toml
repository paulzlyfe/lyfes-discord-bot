kind = "web"
previewPath = "/"
title = "Transport Tycoon Streaks"
version = "1.0.0"
id = "artifacts/tt-streaks"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20903

[services.development]
run = "pnpm --filter @workspace/tt-streaks run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tt-streaks", "run", "build" ]
publicDir = "artifacts/tt-streaks/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20903"
BASE_PATH = "/"
